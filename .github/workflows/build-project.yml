name: Build

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21, 25]
    name: "Java ${{ matrix.java }} build"
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Run the Maven verify phase
        run: mvn -B -P verify -DexcludedGroups= verify
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ runner.os }}-${{ matrix.java }}
          path: opendj-server-legacy/target/unit-tests/package-instance/logs/
      - name: Test setup
        run: |
          opendj-server-legacy/target/package/wrends/setup \
            --cli \
            --backendType je \
            --baseDN dc=example,dc=com \
            --sampleData 200 \
            --ldapPort 1389 \
            --adminConnectorPort 4444 \
            --rootUserDN "cn=Directory Manager" \
            --rootUserPassword password \
            --no-prompt \
            --noPropertiesFile
      - name: Test status
        run: |
          opendj-server-legacy/target/package/wrends/bin/status \
            --bindDN "cn=Directory Manager" \
            --bindPassword password \
            > /tmp/wrends-status.txt
          grep -q "Server Run Status:\s\+Started" /tmp/wrends-status.txt
          grep -q "Entries:\s\+202" /tmp/wrends-status.txt
      - name: Test ldapsearch
        run: |
          opendj-server-legacy/target/package/wrends/bin/ldapsearch \
            --port 1389 \
            --baseDN dc=example,dc=com \
            "(uid=user.0)" | \
            grep -q "dn: uid=user.0,ou=People,dc=example,dc=com"
